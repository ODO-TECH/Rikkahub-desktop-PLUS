name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pc-server-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install pc-server dependencies
        working-directory: pc-server
        run: |
          bun install --frozen-lockfile
          bun run scripts/prepare-linux-build.ts

      - name: Type check pc-server
        working-directory: pc-server
        run: bun run typecheck

      - name: Run pc-server unit tests
        working-directory: pc-server
        run: |
          bun run scripts/prepare-linux-build.ts
          # embedded-bash.ts 顶层 import ../../assets/bash-bundle.tar.gz(Windows-only
          # 构建产物,gitignored)。Linux CI 无法生成,但 bun test 需要解析该 import。
          # 创建 dummy 文件让解析成功;embedded-bash.test.ts 在非 Windows 平台会跳过。
          mkdir -p assets
          [ -f assets/bash-bundle.tar.gz ] || echo "dummy" > assets/bash-bundle.tar.gz
          bun test

      - name: Run request-chain smoke
        working-directory: pc-server
        run: bun run smoke:request-chain

      - name: Run backup roundtrip smoke
        working-directory: pc-server
        run: bun run smoke:backup-roundtrip

      - name: Check version consistency
        working-directory: pc-server
        run: bun run scripts/check-version-sync.ts

  web-ui-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # web-ui 测试经 @server 别名 import pc-server 模块(speech-catalog 契约锁拉
      # media/tts → model-providers → message-builder → files/index,后者顶层
      # import ../node_modules/mupdf/.../mupdf-wasm.wasm——文件路径解析不走 node
      # module resolution,pc-server 的 node_modules 必须真实存在)。
      - name: Install pc-server dependencies
        working-directory: pc-server
        run: |
          bun install --frozen-lockfile
          bun run scripts/prepare-linux-build.ts

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: bun install --frozen-lockfile

      - name: Type check web-ui
        working-directory: web-ui
        run: bun run typecheck

      - name: Run web-ui unit tests
        working-directory: web-ui
        run: bun run test:unit

      - name: Build web-ui
        working-directory: web-ui
        run: bun run build
