name: Build Linux x64 tar.gz

# Linux release format is intentionally limited to the standalone x64 archive.
# It contains the native Bun server binary and the built web UI; users run it
# on Linux and access the UI through a browser.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override; defaults to alpha-manifest.json'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Resolve version
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./alpha-manifest.json').version")"
          fi
          source_version="$(node -p "require('./alpha-manifest.json').version")"
          if [ "$version" != "$source_version" ]; then
            echo "Requested version $version differs from source version $source_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux x64 tar.gz
        run: bash scripts/build-linux.sh "$GITHUB_WORKSPACE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rikkahub_${{ steps.ver.outputs.version }}_linux_x64
          path: Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rikkahub_${{ steps.ver.outputs.version }}_linux_x64.tar.gz
